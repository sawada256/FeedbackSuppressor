name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install ninja
      - name: Build and test (universal)
        run: ./scripts/build-macos.sh
      - name: Package
        run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FeedbackSuppressorV3-macOS-universal
          path: dist/*.zip
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Feedback Suppressor $GITHUB_REF_NAME" --notes "See README for installation (including the quarantine step)."
