name: build

on:
  push:
    branches: [main, v2.1]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install ninja
      - name: Build and test (universal)
        run: ./scripts/build-macos.sh
      - name: Package
        run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, validate and package (x64 VST3 + installer)
        shell: pwsh
        env:
          FS_PLUGINVAL: '1'
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Feedback Suppressor V2.1 ($GITHUB_REF_NAME)" --notes "V2.1: V2 detection results unchanged (verified bit-identical on synthetic tests) with real-time-safety, click and state fixes and lighter analysis. macOS universal ZIP (VST3/AU/Standalone) and Windows x64 installer/ZIP (VST3/Standalone). See README for installation."
